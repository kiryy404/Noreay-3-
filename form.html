<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(86, 73, 201);
        }
        FORM {
            width: 300px;
            height: 300px;
            PADDING: 20px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: aliceblue;
            box-shadow: 1px 1px 1px rgb(230, 226, 226, 0.1);
        }
        .formcontroller {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {
            padding: 5px;
            border: 1px solid black;
            border-radius: 3px;
        }
        input[type="submit"] {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background-color: rgb(66, 20, 55);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
  <form action="">
    <div class="formcontroller">
      <label for="username">Username:</label>
      <input type="text" id="username" name="Username" required>
    </div>
    <div class="formcontroller">
      <label for="password">Password:</label>
      <input type="password" id="password" name="Password" required>
    </div>
    <div class="formcontroller">
      <input type="submit" value="login">
  </form>
</body>
</html>
